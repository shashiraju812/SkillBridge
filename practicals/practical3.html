<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Practical 3: CSS Selection Controls</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f9fafb; margin: 40px; color: #1f2937; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { color: #0d9488; margin-top: 0; }
        
        /* Custom styled checkboxes */
        .skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 15px; }
        .control-chip {
            display: flex; align-items: center; gap: 8px; padding: 10px 14px;
            border: 2px solid #e5e7eb; border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
        }
        .control-chip:hover { border-color: #0d9488; background: #f0fdfa; }
        .control-chip input[type="checkbox"] { accent-color: #0d9488; width: 16px; height: 16px; }

        /* Custom Segmented Radio Buttons */
        .segmented-group { display: flex; border: 1px solid #d1d5db; border-radius: 8px; overflow: hidden; margin-top: 10px; width: fit-content; }
        .segmented-group label {
            padding: 8px 18px; cursor: pointer; background: #fff; font-size: 14px; border-right: 1px solid #d1d5db; transition: background 0.2s;
        }
        .segmented-group label:last-child { border-right: none; }
        .segmented-group input[type="radio"] { display: none; }
        .segmented-group input[type="radio"]:checked + span { font-weight: bold; color: #0d9488; }
        .segmented-group label:has(input:checked) { background: #ccfbf1; }

        /* Interactive dropdown */
        select.styled-select {
            width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; background: white; font-size: 14px; margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Practical 3: CSS &amp; Selection Controls</h2>
    <p style="color:#6b7280;">Demonstrating styled form selection components for skill picking and preferences.</p>

    <h3>1. Select Skill Badges (Multi-Select CSS Controls)</h3>
    <div class="skill-grid">
        <label class="control-chip"><input type="checkbox" checked> Java SE</label>
        <label class="control-chip"><input type="checkbox" checked> Python 3</label>
        <label class="control-chip"><input type="checkbox"> PHP 8</label>
        <label class="control-chip"><input type="checkbox"> MySQL DB</label>
        <label class="control-chip"><input type="checkbox"> React.js</label>
        <label class="control-chip"><input type="checkbox"> Git / GitHub</label>
    </div>

    <h3 style="margin-top:25px;">2. Proficiency Level (Segmented Radio Controls)</h3>
    <div class="segmented-group">
        <label><input type="radio" name="prof" value="beginner"> <span>Beginner</span></label>
        <label><input type="radio" name="prof" value="intermediate" checked> <span>Intermediate</span></label>
        <label><input type="radio" name="prof" value="advanced"> <span>Advanced</span></label>
    </div>

    <h3 style="margin-top:25px;">3. Preferred Work Mode (Styled Dropdown)</h3>
    <select class="styled-select">
        <option>Remote (Work from home)</option>
        <option selected>Hybrid (2 days office, 3 days remote)</option>
        <option>Onsite (Office campus)</option>
    </select>
</div>

</body>
</html>
